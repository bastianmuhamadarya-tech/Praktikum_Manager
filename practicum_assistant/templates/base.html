<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Praktikum Manager{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Times New Roman', 'Times', 'serif']
                    }
                }
            }
        }
    </script>

    <!-- Font Awesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">

    <!-- CSS sendiri -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <!-- Terapkan tema gelap tersimpan sebelum halaman tampil -->
    <script>
        try {
            if (localStorage.getItem('theme') === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
    </script>

    {% block head_extra %}{% endblock %}
</head>
<body class="h-full antialiased text-slate-800 dark:text-slate-100 flex flex-col md:flex-row min-h-screen" data-page="{% block page %}{% endblock %}">

    <!-- Overlay sidebar untuk mobile -->
    <div id="sidebar-overlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-40 hidden transition-opacity duration-300"></div>

    <!-- Header mobile -->
    <header class="md:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 z-30 sticky top-0">
        <div class="flex items-center gap-3">
            <button onclick="toggleSidebar()" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>
            <span class="font-bold text-lg text-brand-600 dark:text-brand-500 flex items-center gap-2">
                <i class="fa-solid fa-flask"></i> Praktikum Lab
            </span>
        </div>
        <button onclick="toggleDarkMode()" class="p-2 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg">
            <i class="fa-solid fa-moon dark:hidden"></i>
            <i class="fa-solid fa-sun hidden dark:block"></i>
        </button>
    </header>

    <!-- Sidebar -->
    <aside id="sidebar" class="fixed md:static inset-y-0 left-0 z-50 w-72 bg-white dark:bg-slate-800 border-r border-slate-200 dark:border-slate-700 flex flex-col transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out">
        <div class="p-5 border-b border-slate-200 dark:border-slate-700 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="p-2.5 bg-brand-500 text-white rounded-xl shadow-md">
                    <i class="fa-solid fa-vial-circle-check text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-slate-900 dark:text-white text-base leading-tight">Praktikum Manager</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Asisten Laporan Lab</p>
                </div>
            </div>
            <button onclick="toggleSidebar()" class="md:hidden text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
        </div>

        <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
            <div class="px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Mata Kuliah Praktikum</div>

            <div id="courses-list" class="space-y-1.5"></div>

            <button onclick="promptAddCourse()" class="w-full flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-brand-600 dark:text-brand-400 hover:bg-brand-50 dark:hover:bg-slate-700/40 rounded-xl transition-all border border-dashed border-brand-300 dark:border-slate-600 mt-2">
                <i class="fa-solid fa-plus"></i> Tambah Matkul Praktikum
            </button>

            <div class="pt-6 px-3 py-2 text-xs font-semibold text-slate-400 uppercase tracking-wider">Fitur &amp; Tools Praktikum</div>

            <a href="{{ url_for('praktikum', tab='calculator') }}" id="nav-calculator" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
                <i class="fa-solid fa-calculator text-brand-500"></i> Kalkulator Praktikum
            </a>

            <a href="{{ url_for('praktikum', tab='appendix') }}" id="nav-appendix" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
                <i class="fa-solid fa-file-word text-blue-500"></i> Lampiran Rangkaian Listrik
            </a>

            <a href="{{ url_for('lampiran_analog') }}" id="nav-analog" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700/50 transition-colors">
                <i class="fa-solid fa-file-word text-emerald-500"></i> Lampiran Elektronika Analog
            </a>
        </nav>

        <div class="p-4 border-t border-slate-200 dark:border-slate-700 space-y-2">
            <button onclick="resetAllData()" class="w-full flex items-center justify-center gap-2 px-3 py-2 text-xs text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-950/40 rounded-lg transition-colors">
                <i class="fa-solid fa-rotate-right"></i> Reset Semua Progress
            </button>
            <div class="hidden md:flex items-center justify-between px-2 pt-2 text-xs text-slate-400 border-t border-slate-100 dark:border-slate-700/50">
                <span>Mode Gelap</span>
                <button onclick="toggleDarkMode()" class="p-1.5 rounded-lg text-slate-500 hover:bg-slate-100 dark:hover:bg-slate-700">
                    <i class="fa-solid fa-moon dark:hidden"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-amber-400"></i>
                </button>
            </div>
        </div>
    </aside>

    <!-- Area konten utama (diisi oleh tiap halaman) -->
    <main class="flex-1 overflow-y-auto p-4 md:p-8 space-y-6">
        {% block content %}{% endblock %}
    </main>

    <!-- Modal dialog kustom (pengganti prompt/confirm/alert bawaan browser) -->
    <div id="app-modal" class="fixed inset-0 z-[60] hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl shadow-xl w-full max-w-sm p-5 space-y-4 border border-slate-200 dark:border-slate-700">
            <h3 id="modal-title" class="font-bold text-lg text-slate-900 dark:text-white"></h3>
            <p id="modal-message" class="text-sm text-slate-600 dark:text-slate-300"></p>
            <input id="modal-input" type="text" class="hidden w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:ring-2 focus:ring-brand-500 outline-none">
            <div class="flex justify-end gap-2">
                <button id="modal-cancel" class="px-4 py-2 text-sm font-semibold text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-xl">Batal</button>
                <button id="modal-ok" class="px-4 py-2 text-sm font-semibold text-white bg-brand-600 hover:bg-brand-700 rounded-xl">OK</button>
            </div>
        </div>
    </div>

    <!-- JavaScript bersama untuk semua halaman -->
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
